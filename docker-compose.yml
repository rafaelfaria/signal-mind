services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signal_mind
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
    volumes:
      - signal_mind_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "192.168.0.100:3001:3000"
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://signal:signal@postgres:5432/signal_mind
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://192.168.0.100:3001}
      APP_NAME: ${APP_NAME:-Signal Mind}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Australia/Brisbane}
      AGENT_API_KEY: ${AGENT_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  signal_mind_pgdata:
